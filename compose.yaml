services:

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    ports:
      - "8000:8000"
    environment:
      - MRTA_ENV=dev
      - OLLAMA_HOST=http://host.docker.internal:11434
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      # The API loads two models before it serves: the CLIP encoder for the
      # visual index and the cross-encoder reranker. Measured cold start in this
      # image is ~70s, and a first run that has to fetch weights is slower still.
      # 30s was survivable only while the CLIP index was silently failing to
      # build (ADR-014 §1) and CLIP therefore never loaded at startup. With a
      # working visual index the load is real work, not a hang.
      start_period: 180s
      retries: 3

  streamlit:
    build:
      context: .
      dockerfile: docker/Dockerfile.streamlit
    ports:
      - "8501:8501"
    environment:
      - MRTA_ENV=dev
      - OLLAMA_HOST=http://host.docker.internal:11434
      - API_URL=http://api:8000
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
