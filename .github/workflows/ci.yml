name: CI

# Retained coverage that belongs to neither tier's core loop (ADR-012).
#
# Lint, format, type-check and the fast test suite moved to "MRTA Fast PR CI";
# heavyweight tests and the benchmark gate moved to "MRTA Evaluation Regression".
# What is left here is the packaging and supply-chain surface: a vulnerability
# scan and a real container build with a live /health check.
#
# The job names `audit` and `docker` are unchanged so any branch protection
# already requiring them keeps resolving. They no longer chain behind `test`,
# which used to serialise the whole workflow behind the suite.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install --upgrade pip && pip install -e ".[dev,api,pdf,retrieval,multimodal,eval]"

      - name: Vulnerability scan (pip-audit)
        # continue-on-error: transient PyPI 503s can crash pip-audit; audit is best-effort in CI
        # --skip-editable: mrta is a local editable install, not on PyPI
        # --ignore-vuln CVE-2025-3000: torch vulnerability with no fix available yet
        # --ignore-vuln PYSEC-2026-3447: setuptools vuln in GitHub runner env, not in our deps
        continue-on-error: true
        run: pip-audit --skip-editable --ignore-vuln CVE-2025-3000 --ignore-vuln PYSEC-2026-3447

  docker:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -f docker/Dockerfile.api -t mrta-api:ci .

      - name: Smoke test /health
        run: |
          docker run -d --name mrta-ci -e MRTA_ENV=test -p 8000:8000 mrta-api:ci
          for i in 1 2 3 4 5; do
            sleep 6
            curl --fail --silent http://localhost:8000/health && docker stop mrta-ci && exit 0
            echo "Attempt $i failed, retrying..."
          done
          echo "=== Container logs ==="
          docker logs mrta-ci
          docker stop mrta-ci
          exit 1
