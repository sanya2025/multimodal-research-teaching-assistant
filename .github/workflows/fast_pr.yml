name: MRTA Fast PR CI

# Tier 1 of the two-tier gate (ADR-012): fast, developer-facing feedback on
# every pull request. It must run on a plain CPU runner with no GPU, no Ollama,
# no paid API and no secrets, so it also works for forks.
#
# What Tier 1 does NOT do is evaluate the benchmark. Retrieval quality is
# protected by MRTA Evaluation Regression, which is heavier and runs on main.

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: nothing here writes to the repository.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MRTA_ENV: test
  # Tier 1 must never reach a model hub. Any test that would download weights is
  # marked `heavy` and deselected below; this makes a mistake fail loudly instead
  # of quietly costing minutes.
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"

jobs:
  # The three jobs are independent on purpose: the critical path is the slowest
  # one, not the sum. The previous single-workflow CI chained everything behind
  # `needs: test`.
  lint-and-type:
    name: lint-and-type
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev,api,pdf,retrieval,multimodal,eval]"

      # Black remains the formatter of record; ruff lints only. Swapping in
      # `ruff format` would reformat the repository for no benefit here.
      - name: Lint (ruff)
        run: ruff check src/ tests/ apps/

      - name: Format check (black)
        run: black --check src/ tests/ apps/

      - name: Type check (mypy)
        run: mypy src/ apps/ --ignore-missing-imports

  fast-tests:
    name: fast-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev,api,pdf,retrieval,multimodal,eval]"

      # Marker-based, not path-based: two heavyweight tests live in tests/unit,
      # and tests/evaluation is fast and worth running on every PR now that the
      # benchmark assets are committed.
      - name: Fast tests
        run: pytest -m "not heavy" --durations=10

  smoke-eval:
    name: smoke-eval
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev,retrieval,eval]"

      # Synthetic candidates through the real evaluator, the real summary schema
      # and the real gate. Catches a broken evaluation path in seconds; proves
      # nothing about retrieval quality.
      - name: Smoke evaluation (synthetic — not a benchmark result)
        run: python scripts/smoke_eval.py
